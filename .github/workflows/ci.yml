# Pull requests and pushes: build and test on Linux and Windows; the Windows build is
# uploaded as an artifact (cpuview.exe with the wallpapers, LICENSE and README).
# (actions pinned to commit SHAs: the organisation requires it)
name: ci
on:
  pull_request:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - run: cargo test --release --locked

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - run: cargo test --release --locked
      - run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/cpuview/wallpapers | Out-Null
          Copy-Item target/release/cpuview.exe, LICENSE, README.md dist/cpuview/
          Copy-Item wallpapers/*.jpg, wallpapers/*.png, wallpapers/CREDITS.md, wallpapers/credits.toml dist/cpuview/wallpapers/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cpuview-windows-x86_64
          path: dist/cpuview
          retention-days: 14
