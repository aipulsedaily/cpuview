# cpuview theme — schema: themes/README.md
name = "aurora"
label = "Aurora"
description = "Green-violet aurora curtains over a dark ridge on a starry night"
schema = 1

[palette]
bg        = "#02060e"
panel     = "#061019"
bar       = "#03070d"
select    = "#0f2e33"
chip      = "#10302f"
track     = "#10242a"
border    = "#173238"
border_hi = "#2f8f78"
title     = "#eafff6"
accent    = "#5cf2a6"
accent2   = "#9b7bff"
fg        = "#e2f7ef"
text      = "#b0d2c6"
mid       = "#7aa198"
dim       = "#4d6f6a"
good      = "#5cf2a6"
warn      = "#e6f06a"
crit      = "#ff5c7a"
freq = ["#1b4d6b", "#2fb7a0", "#5cf2a6", "#e1ffef"]
load = ["#5cf2a6", "#e6f06a", "#ffad5c", "#ff5c7a"]
temp = ["#6ac8ff", "#5cf2a6", "#e6f06a", "#ff5c7a"]

[blend]
brightness = 0.95
screen = { tint = "#02060e", alpha = 0.0,  text_alpha = 0.35 }
bar    = { tint = "#01040a", alpha = 0.5,  text_alpha = 0.66 }
panel  = { tint = "#030a12", alpha = 0.5,  text_alpha = 0.8 }
select = { tint = "#123c3c", alpha = 0.6,  text_alpha = 0.75 }
chip   = { tint = "#123a36", alpha = 0.85, text_alpha = 0.9 }
track  = { tint = "#1c3a3e", alpha = 0.72 }
dialog = { tint = "#030910", alpha = 0.8,  text_alpha = 0.9 }

[[background]]
type = "gradient"
angle = 0
stops = [[0.0, "#01030a"], [0.55, "#031024"], [0.8, "#06203a"], [1.0, "#030a14"]]

[[background]]
type = "stars"
seed = 13
density = 0.004
min_brightness = 0.25
density_gradient = -0.8
colors = ["#ffffff", "#d8fff0", "#e6dcff"]
glyph_density = 0.012
glyphs = ["·", "·", "∙", "•"]

[[background]]
type = "aurora"
seed = 3
opacity = 0.9
bands = [
  { y = 0.42, amplitude = 0.07, waves = 1.3, phase = 0.1, height = 0.28, streaks = 110, bottom_color = "#3dff9e", top_color = "#7b4dff", intensity = 0.8 },
  { y = 0.58, amplitude = 0.05, waves = 0.8, phase = 0.55, height = 0.2, streaks = 70, bottom_color = "#2ee6c0", top_color = "#3a6bff", intensity = 0.55 },
]

[[background]]
type = "silhouette"
kind = "mountains"
seed = 8
base = 0.97
height = 0.2
roughness = 3.0
color = "#06142a"
opacity = 1.0

[[background]]
type = "silhouette"
kind = "mountains"
seed = 19
base = 1.02
height = 0.16
roughness = 5.0
color = "#02060c"
rim = "#0d3a3a"

[[background]]
